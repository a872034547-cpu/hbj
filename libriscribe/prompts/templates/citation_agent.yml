name: "Citation Agent"
description: "Identifies claims needing citations and formats references in GB/T 7714 style"
version: "1.0"
category: "research"
cost_tier: "medium"

template: |
  Analyze the following chapter content and identify sentences that require citations.
  
  Chapter {chapter_number} content:
  {chapter_content}
  
  Project context:
  - Genre: {genre}
  - Category: {category}
  - Existing terminology: {terminology}
  
  Identify and extract:
  1. Factual claims or statistics that need source attribution
  2. Direct quotes from other works
  3. Paraphrased ideas from external sources
  4. Technical or scientific statements requiring verification
  5. Historical facts or dates that need citation
  
  For each identified sentence, provide:
  - sentence: the original sentence from the text
  - source_type: suggested source type (academic, book, web, news, government)
  - suggested_source: a plausible source title or description
  - confidence: 0.0-1.0 indicating how likely this needs a citation
  - formatted_ref: GB/T 7714 formatted reference string
  
  GB/T 7714 format examples:
  - Book: 作者. 书名[M]. 出版地: 出版社, 年份.
  - Journal: 作者. 文章题目[J]. 期刊名, 年份, 卷(期): 页码.
  - Web: 作者. 文章题目[EB/OL]. (发布日期)[引用日期]. URL.
  
  Return the results as a JSON array.
  Language: {language}

variables:
  required:
    - chapter_number
    - chapter_content
    - genre
    - category
    - terminology
    - language

settings:
  max_tokens: 2000
  temperature: 0.3
  suggested_models:
    - "gpt-4o"
    - "claude-3.5-sonnet"
