name: "Critic Agent"
description: "Quality review agent that scores chapters and provides detailed improvement feedback"
version: "1.0"
category: "review"
cost_tier: "high"

template: |
  You are a professional book editor and quality reviewer. Perform a thorough review of Chapter {chapter_number}.
  
  Chapter content:
  {chapter_content}
  
  Project context:
  - Title: {book_title}
  - Genre: {genre}
  - Category: {category}
  - Style guide: {style_guide}
  
  Character profiles:
  {characters}
  
  Worldbuilding details:
  {worldbuilding}
  
  Previous chapter summaries:
  {previous_summaries}
  
  Terminology to maintain consistency:
  {terminology}
  
  Evaluate the chapter on these dimensions (score each 0-10):
  1. **Plot Consistency**: Does the chapter align with the overall story arc? Are there plot holes?
  2. **Character Consistency**: Do characters behave consistently with their profiles? Is dialogue authentic?
  3. **Writing Quality**: Prose quality, vocabulary, sentence variety, show vs tell
  4. **Pacing**: Is the pacing appropriate? Are there sections that drag or rush?
  5. **Terminology Usage**: Are terms used consistently? Any contradictions?
  6. **Narrative Continuity**: Does this chapter connect well with previous chapters?
  7. **Style Adherence**: Does the writing match the project's style guide?
  
  Provide your review as a JSON object with:
  - overall_score: float 0-10 (weighted average)
  - dimension_scores: object with score for each dimension
  - consistency_issues: array of specific consistency problems found
  - terminology_issues: array of terminology inconsistencies
  - suggestions: array of specific, actionable improvement suggestions
  - strengths: array of things done well
  - summary: brief overall assessment (2-3 sentences)
  
  Be specific and reference exact sentences or paragraphs when pointing out issues.
  Language: {language}

variables:
  required:
    - chapter_number
    - chapter_content
    - book_title
    - genre
    - category
    - style_guide
    - characters
    - worldbuilding
    - previous_summaries
    - terminology
    - language

settings:
  max_tokens: 3000
  temperature: 0.3
  suggested_models:
    - "gpt-4o"
    - "claude-3.5-sonnet"
